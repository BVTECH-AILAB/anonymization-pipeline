# Same skeleton as the other AGENAS services (generate-vars, build-sonar,
# build-image, download-harbor-csv) plus the blocking quality stage taken
# from ai-platform: a broken lint, type check or test never becomes an image.
#
# Branches: test -> staging image (YYYY.MM.DD-test.<epoch>), main -> prod image (YYYY.MM.DD).

default:
  before_script:
    - docker info

variables:
  IMAGE_NAME: anonmyzation-pipeline
  REGISTRY: harbor.agenas.oci
  REPO_OWNER: agenas
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"
  UV_IMAGE: ghcr.io/astral-sh/uv:python3.12-bookworm-slim

stages:
  - generate-vars
  - quality
  - build-sonar
  - build-image
  - download-harbor-csv

generate-vars:
  stage: generate-vars
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
    - if: $CI_COMMIT_BRANCH == "dev"
      variables:
        IMAGE_TAG_SUFFIX_AUX: "-dev.%s"
      when: on_success
    - if: $CI_COMMIT_BRANCH == "test"
      variables:
        IMAGE_TAG_SUFFIX_AUX: "-test.%s"
      when: on_success
  script:
    - export IMAGE_TAG_SUFFIX=`echo $(date +%Y.%m.%d$IMAGE_TAG_SUFFIX_AUX)`
    - echo "IMAGE_TAG_SUFFIX=$IMAGE_TAG_SUFFIX" >> build.env
    - cat build.env
  artifacts:
    reports:
      dotenv: build.env

.quality-base:
  stage: quality
  variables:
    # Root-owned caches from older runs are removed below as root.
    GIT_CLEAN_FLAGS: none
  before_script:
    - docker run --rm -v "$CI_PROJECT_DIR":/app "$UV_IMAGE" rm -rf /app/.ruff_cache /app/.venv /app/.pytest_cache 2>/dev/null || true
    - docker info
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'test'
    - if: $CI_COMMIT_BRANCH == 'dev'

lint:
  extends: .quality-base
  script:
    - >
      docker run --rm --user "$(id -u):$(id -g)"
      -v "$CI_PROJECT_DIR":/app -w /app
      -e HOME=/tmp -e UV_PROJECT_ENVIRONMENT=/tmp/.venv -e UV_CACHE_DIR=/tmp/uv-cache -e RUFF_CACHE_DIR=/tmp/ruff-cache
      "$UV_IMAGE" sh -c
      "uv sync --frozen &&
      uv run ruff check &&
      uv run ruff format --check &&
      uv run ty check tests &&
      (cd packages/anonymization-core && uv run ty check src tests) &&
      (cd apps/api && uv run ty check src tests)"

tests:
  extends: .quality-base
  script:
    - >
      docker run --rm --user "$(id -u):$(id -g)"
      -v "$CI_PROJECT_DIR":/app -w /app
      -e HOME=/tmp -e UV_PROJECT_ENVIRONMENT=/tmp/.venv -e UV_CACHE_DIR=/tmp/uv-cache -e CI=true
      "$UV_IMAGE" sh -c
      "uv sync --frozen &&
      uv run pytest -q &&
      (cd packages/anonymization-core && uv run pytest --cov --cov-report=xml:coverage.xml --junitxml=junit.xml -q) &&
      (cd apps/api && uv run pytest --cov --cov-report=xml:coverage.xml --junitxml=junit.xml -q)"
    # Paths are recorded as seen inside the container: rewrite them for Sonar.
    - sed -i "s|/app/|$CI_PROJECT_DIR/|g" packages/anonymization-core/coverage.xml apps/api/coverage.xml
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - packages/anonymization-core/coverage.xml
      - apps/api/coverage.xml
    reports:
      junit:
        - packages/anonymization-core/junit.xml
        - apps/api/junit.xml

# Analysis only: allow_failure so an unreachable Sonar never blocks the pipeline.
build-sonar:
  stage: build-sonar
  dependencies:
    - tests
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${SONAR_USER_HOME}/cache"
      - sonar-scanner/
  script:
    - /opt/sonar-scanner-8.0.1.6346-linux-x64/bin/sonar-scanner -Dsonar.host.url="http://sonar.agenas.oci"
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'test'
    - if: $CI_COMMIT_BRANCH == 'dev'

build-image:
  stage: build-image
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "test"
    - if: $CI_COMMIT_BRANCH == "dev"
  script:
    - echo "Build $REGISTRY/$REPO_OWNER/$IMAGE_NAME:$IMAGE_TAG_SUFFIX"
    - docker build -f apps/api/Dockerfile --target runtime -t $REGISTRY/$REPO_OWNER/$IMAGE_NAME:$IMAGE_TAG_SUFFIX .
    - docker push $REGISTRY/$REPO_OWNER/$IMAGE_NAME:$IMAGE_TAG_SUFFIX

download-harbor-csv:
  stage: download-harbor-csv
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "test"
    - if: $CI_COMMIT_BRANCH == "dev"
  script:
    - echo "Controllo scansione per il tag $IMAGE_TAG_SUFFIX..."
    - |
      STATUS="running"
      while [ "$STATUS" != "Success" ]; do
        echo "Stato scansione: $STATUS... attendo 10 secondi"
        sleep 10
        STATUS=$(curl -u "$HARBOR_CREDENTIALS" -s -X GET \
          "$REGISTRY/api/v2.0/projects/$REPO_OWNER/repositories/$IMAGE_NAME/artifacts/$IMAGE_TAG_SUFFIX?with_scan_overview=true" \
          | jq -r '.scan_overview | to_entries[0].value.scan_status // "Not Scanned"')
        if [ "$STATUS" == "Error" ]; then echo "Errore nella scansione su Harbor"; exit 1; fi
        if [ "$STATUS" == "Not Scanned" ]; then echo "Scansione non ancora partita"; STATUS="waiting"; fi
      done
    - |
      curl -u "$HARBOR_CREDENTIALS" -s -X GET \
        "$REGISTRY/api/v2.0/projects/$REPO_OWNER/repositories/$IMAGE_NAME/artifacts/$IMAGE_TAG_SUFFIX/additions/vulnerabilities" \
        -H "Accept: application/json" | jq -r '
          ( .[ ] | .vulnerabilities ) as $vulns |
          ["CVE_ID", "Severity", "Package", "Version", "Fix_Version", "Description"],
          ($vulns[] | [.id, .severity, .package, .version, .fix_version, .description])
          | @csv' > report_vulnerabilita_$IMAGE_TAG_SUFFIX.csv
  artifacts:
    when: always
    paths:
      - report_vulnerabilita_$IMAGE_TAG_SUFFIX.csv
    expire_in: 1 month
