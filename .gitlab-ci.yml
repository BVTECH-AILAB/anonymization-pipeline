# Same skeleton as the other AGENAS services (generate-vars, build-sonar,
# build-image, download-harbor-csv) plus the blocking quality stage taken
# from ai-platform: a broken lint, type check or test never becomes an image.
#
# Branches: test -> staging image (YYYY.MM.DD-test.<epoch>), main -> prod image (YYYY.MM.DD).

default:
  before_script:
    - docker info

variables:
  IMAGE_NAME: anonymization-pipeline
  REGISTRY: harbor.agenas.oci
  REPO_OWNER: agenas
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"
  # pinned: the same uv as backend/Dockerfile (the unversioned bookworm tag stopped at uv 0.9)
  UV_IMAGE: ghcr.io/astral-sh/uv:0.12.18-python3.12-trixie-slim

stages:
  - generate-vars
  - quality
  - build-sonar
  - build-image
  - download-harbor-csv

generate-vars:
  stage: generate-vars
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
    - if: $CI_COMMIT_BRANCH == "dev"
      variables:
        IMAGE_TAG_SUFFIX_AUX: "-dev.%s"
      when: on_success
    - if: $CI_COMMIT_BRANCH == "test"
      variables:
        IMAGE_TAG_SUFFIX_AUX: "-test.%s"
      when: on_success
  script:
    - export IMAGE_TAG_SUFFIX=`echo $(date +%Y.%m.%d$IMAGE_TAG_SUFFIX_AUX)`
    - echo "IMAGE_TAG_SUFFIX=$IMAGE_TAG_SUFFIX" >> build.env
    - cat build.env
  artifacts:
    reports:
      dotenv: build.env

.quality-base:
  stage: quality
  variables:
    # Root-owned caches from older runs are removed below as root.
    GIT_CLEAN_FLAGS: none
  before_script:
    - docker run --rm -v "$CI_PROJECT_DIR":/app "$UV_IMAGE" rm -rf /app/.ruff_cache /app/.venv /app/.pytest_cache 2>/dev/null || true
    - docker info

# One job per package: lint, types and tests of that package only, in its own
# environment (uv sync --package). UV_SCRIPT runs in the uv image, in the repo.
.uv-job:
  extends: .quality-base
  script:
    - >
      docker run --rm --user "$(id -u):$(id -g)"
      -v "$CI_PROJECT_DIR":/app -w /app
      -e HOME=/tmp -e UV_PROJECT_ENVIRONMENT=/tmp/.venv -e UV_CACHE_DIR=/tmp/uv-cache -e RUFF_CACHE_DIR=/tmp/ruff-cache -e CI=true
      "$UV_IMAGE" sh -c "$UV_SCRIPT"

# A job runs when its package (or one it depends on) changes. On main, test
# and dev the comparison is with the previous push, so a merge runs every job
# its changes touch.
.paths:
  core: &core-paths
    - backend/core/**/*
    - pyproject.toml
    - uv.lock
    - .gitlab-ci.yml
  api: &api-paths
    - backend/**/*
    - pyproject.toml
    - uv.lock
    - .gitlab-ci.yml
  eval: &eval-paths
    - evaluation/**/*
    - backend/core/**/*
    - pyproject.toml
    - uv.lock
    - .gitlab-ci.yml
  ocr: &ocr-paths
    - ocr-server/**/*
    - .gitlab-ci.yml

core:
  extends: .uv-job
  variables:
    UV_SCRIPT: >-
      uv sync --frozen --package anonymization-core &&
      cd backend/core &&
      uv run ruff check && uv run ruff format --check && uv run ty check src tests &&
      uv run pytest --cov --cov-report=xml:coverage.xml --junitxml=junit.xml -q
  after_script:
    # Paths are recorded as seen inside the container: rewrite them for Sonar.
    - sed -i "s|/app/|$CI_PROJECT_DIR/|g" backend/core/coverage.xml || true
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - backend/core/coverage.xml
    reports:
      junit: backend/core/junit.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' || $CI_COMMIT_BRANCH =~ /^(main|test|dev)$/
      changes: *core-paths

api:
  extends: .uv-job
  variables:
    UV_SCRIPT: >-
      uv sync --frozen --package anonymization-pipeline &&
      cd backend/api &&
      uv run ruff check && uv run ruff format --check && uv run ty check src tests &&
      uv run pytest --cov --cov-report=xml:coverage.xml --junitxml=junit.xml -q
  after_script:
    - sed -i "s|/app/|$CI_PROJECT_DIR/|g" backend/api/coverage.xml || true
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - backend/api/coverage.xml
    reports:
      junit: backend/api/junit.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' || $CI_COMMIT_BRANCH =~ /^(main|test|dev)$/
      changes: *api-paths

# Dev only, never in an image: lint, types and tests, no coverage gate.
eval:
  extends: .uv-job
  variables:
    UV_SCRIPT: >-
      uv sync --frozen --package anonymization-eval &&
      cd evaluation &&
      uv run ruff check && uv run ruff format --check && uv run ty check src tests &&
      uv run pytest -q
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' || $CI_COMMIT_BRANCH =~ /^(main|test|dev)$/
      changes: *eval-paths

# Its own lock, outside the workspace; the CPU build of ONNX Runtime is enough for the tests.
ocr-server:
  extends: .uv-job
  variables:
    UV_SCRIPT: >-
      cd ocr-server &&
      uv sync --frozen --extra cpu &&
      uv run --extra cpu ruff check && uv run --extra cpu ruff format --check &&
      uv run --extra cpu pytest -q
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' || $CI_COMMIT_BRANCH =~ /^(main|test|dev)$/
      changes: *ocr-paths

# Analysis only: allow_failure so an unreachable Sonar never blocks the pipeline.
build-sonar:
  stage: build-sonar
  # coverage of the packages whose job ran in this pipeline
  needs:
    - job: core
      optional: true
      artifacts: true
    - job: api
      optional: true
      artifacts: true
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${SONAR_USER_HOME}/cache"
      - sonar-scanner/
  script:
    - /opt/sonar-scanner-8.0.1.6346-linux-x64/bin/sonar-scanner -Dsonar.host.url="http://sonar.agenas.oci"
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'test'
    - if: $CI_COMMIT_BRANCH == 'dev'

build-image:
  stage: build-image
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "test"
    - if: $CI_COMMIT_BRANCH == "dev"
  script:
    - echo "Build $REGISTRY/$REPO_OWNER/$IMAGE_NAME:$IMAGE_TAG_SUFFIX"
    - docker build -f backend/Dockerfile --target runtime -t $REGISTRY/$REPO_OWNER/$IMAGE_NAME:$IMAGE_TAG_SUFFIX .
    - docker push $REGISTRY/$REPO_OWNER/$IMAGE_NAME:$IMAGE_TAG_SUFFIX

# OCR server (ocr-server): built when it changes, with the same tags
# as the service. Name to confirm with the platform team (docs/DEPLOY_HANDOVER.md).
# OCR_EXTRA=gpu: CUDA wheels; on a node without a GPU the server falls back to the CPU.
build-image-ocr:
  stage: build-image
  variables:
    OCR_IMAGE_NAME: paddle-ocr-server
    OCR_EXTRA: gpu
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(main|test|dev)$/
      changes: *ocr-paths
  script:
    - docker build --build-arg OCR_EXTRA=$OCR_EXTRA -t $REGISTRY/$REPO_OWNER/$OCR_IMAGE_NAME:$IMAGE_TAG_SUFFIX ocr-server
    - docker push $REGISTRY/$REPO_OWNER/$OCR_IMAGE_NAME:$IMAGE_TAG_SUFFIX

download-harbor-csv:
  stage: download-harbor-csv
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "test"
    - if: $CI_COMMIT_BRANCH == "dev"
  script:
    - echo "Controllo scansione per il tag $IMAGE_TAG_SUFFIX..."
    - |
      STATUS="running"
      while [ "$STATUS" != "Success" ]; do
        echo "Stato scansione: $STATUS... attendo 10 secondi"
        sleep 10
        STATUS=$(curl -u "$HARBOR_CREDENTIALS" -s -X GET \
          "$REGISTRY/api/v2.0/projects/$REPO_OWNER/repositories/$IMAGE_NAME/artifacts/$IMAGE_TAG_SUFFIX?with_scan_overview=true" \
          | jq -r '.scan_overview | to_entries[0].value.scan_status // "Not Scanned"')
        if [ "$STATUS" == "Error" ]; then echo "Errore nella scansione su Harbor"; exit 1; fi
        if [ "$STATUS" == "Not Scanned" ]; then echo "Scansione non ancora partita"; STATUS="waiting"; fi
      done
    - |
      curl -u "$HARBOR_CREDENTIALS" -s -X GET \
        "$REGISTRY/api/v2.0/projects/$REPO_OWNER/repositories/$IMAGE_NAME/artifacts/$IMAGE_TAG_SUFFIX/additions/vulnerabilities" \
        -H "Accept: application/json" | jq -r '
          ( .[ ] | .vulnerabilities ) as $vulns |
          ["CVE_ID", "Severity", "Package", "Version", "Fix_Version", "Description"],
          ($vulns[] | [.id, .severity, .package, .version, .fix_version, .description])
          | @csv' > report_vulnerabilita_$IMAGE_TAG_SUFFIX.csv
  artifacts:
    when: always
    paths:
      - report_vulnerabilita_$IMAGE_TAG_SUFFIX.csv
    expire_in: 1 month
