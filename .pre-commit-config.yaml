repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: just backend::format
        language: system
        pass_filenames: false
        types: [python]

      - id: ruff-check
        name: ruff check --fix
        entry: just backend::fix
        language: system
        pass_filenames: false
        types: [python]

      - id: ty-check
        name: ty check
        entry: just backend::types
        language: system
        pass_filenames: false
        types: [python]
