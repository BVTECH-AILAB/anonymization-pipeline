[project]
name = "anonmyzation-pipeline"
version = "0.1.0"
description = "AGENAS MIA service: surgical anonymization of clinical documents (C1), generated from agenas-python-template"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.20",
    # the engine: packages/anonymization-core
    "anonymization-core",
]

[dependency-groups]
dev = [
    # synthetic PDFs and fake engines shared with the engine tests
    "anonymization-core[testing]",
    "httpx>=0.28",
    "pip-audit>=2.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.15",
    "ty>=0.0.1a0",
]

[tool.uv.sources]
anonymization-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anonmyzation_pipeline"]

# Self-contained on purpose: the service lints the same way on its own.
[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Same base as ai-platform / llm-gateway, plus:
#   UP  - modern 3.12 syntax
#   T20 - no print(): everything goes through logging
#   S   - bandit security checks
#   PLC0415 - imports at module level only (CLAUDE.md)
select = ["E", "F", "B", "I", "ARG", "UP", "T20", "S", "TID251", "PLC0415"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ARG"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"logging.basicConfig".msg = "Use anonmyzation_pipeline.logging_setup.setup_logging: it installs the PII redaction filter."
"os.getenv".msg = "Read configuration through Settings in config.py, so every variable has a typed default."
"tools".msg = "The service never imports the developer tools."

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"

[tool.coverage.run]
source = ["anonmyzation_pipeline"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
