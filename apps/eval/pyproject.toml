[project]
name = "anonymization-eval"
version = "0.1.0"
description = "Evaluation of the anonymization engine: synthetic dataset with ground truth, scoring, viewer (dev only, never in an image)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anonymization-core",
    "faker>=30.0",
    "fastapi>=0.115",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pillow>=11.0",
    "pycocotools>=2.0.11",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pypdf>=6.0",
    "pypdfium2>=5.0",
    "python-barcode>=0.15",
    "python-codicefiscale>=0.12",
    "qrcode>=8.0",
    "reportlab>=4.2",
    "scikit-learn>=1.9.1",
    # mAP (torchmetrics, COCO protocol through pycocotools) and its NMS (torchvision)
    "torch>=2.7",
    "torchmetrics>=1.9.0",
    "torchvision>=0.22",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "anonymization-core[testing]",
    "httpx>=0.28",
    "pytest>=8.3",
    "ruff>=0.15",
    "ty>=0.0.1a0",
]

# PyTorch with CUDA 12.8 (Blackwell GPUs included); the same wheels run on CPU.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
anonymization-core = { workspace = true }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anonymization_eval"]

# Self-contained on purpose: the package lints the same way on its own.
[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
#   UP  - modern 3.12 syntax
#   T20 - no print(): everything goes through logging
#   S   - bandit security checks
#   PLC0415 - imports at module level only
select = ["E", "F", "B", "I", "ARG", "UP", "T20", "S", "TID251", "PLC0415"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ARG"]
# Synthetic data generation uses non-cryptographic randomness on purpose.
"src/anonymization_eval/**" = ["S311"]

# The evaluation measures the engine: it never imports the service.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"logging.basicConfig".msg = "Use anonymization_eval.log.setup_logging."
"os.getenv".msg = "Read configuration through EvalSettings in config.py, so every variable has a typed default."
"anonmyzation_pipeline".msg = "The evaluation uses the engine (anonymization_core), never the service."

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
