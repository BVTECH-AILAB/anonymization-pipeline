# Local development stack: the anonymization service (no database: jobs live
# in memory and documents in a private folder until they expire).
# Settings have defaults; this service has no credentials.
# Model weights are cached in the "models" volume, so they download once.
name: anonymization-pipeline

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
      target: dev
    # the service's settings (ANONPIP_*): backend/.env, copied from backend/.env.example;
    # without it the defaults of src/config.py apply (no credentials in this service)
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # inside compose: the OCR server is the paddle-ocr service, the logs are local
      ANONPIP_ENVIRONMENT: ${ANONPIP_ENVIRONMENT:-local}
      ANONPIP_OCR_SERVER_URL: http://paddle-ocr:8829
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/tests:/app/tests
    depends_on:
      - paddle-ocr
    command: >
      uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src

  # OCR server (PP-OCRv5 on RapidOCR, LiteParse OCR API): the service reads scanned pages through it
  paddle-ocr:
    build:
      context: ./ocr-server
      args:
        # cpu works everywhere; gpu (CUDA 12 wheels) needs the deploy block below
        OCR_EXTRA: ${OCR_EXTRA:-cpu}
    environment:
      OCRSRV_LOG_LEVEL: ${OCRSRV_LOG_LEVEL:-INFO}
      OCRSRV_DEVICE: ${OCRSRV_DEVICE:-auto}
      OCRSRV_DET_MODEL: ${OCRSRV_DET_MODEL:-PP-OCRv5_server_det}
      OCRSRV_MARGIN_PT: ${OCRSRV_MARGIN_PT:-60}
      OCRSRV_MARGIN_MIN_SCORE: ${OCRSRV_MARGIN_MIN_SCORE:-0.5}
      OCRSRV_MAX_UPLOAD_MB: ${OCRSRV_MAX_UPLOAD_MB:-40}
      OCRSRV_GPU_MEM_LIMIT_MB: ${OCRSRV_GPU_MEM_LIMIT_MB:-0}
      # weights download there on the first start (about 90 MB)
      OCRSRV_MODEL_DIR: ${OCRSRV_MODEL_DIR:-/models/rapidocr}
    ports:
      - "127.0.0.1:${OCR_PORT:-8829}:8829"
    volumes:
      - models:/models
    # GPU (NVIDIA Container Toolkit, OCR_EXTRA=gpu): uncomment to run OCR on the GPU.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  models:
