# Local development stack.
# Settings have defaults (${VAR:-default}); credentials do not and must be
# set in .env (cp .env.example .env), otherwise compose refuses to start.
name: anonymization-pipeline

services:
  app:
    build:
      context: .
      target: dev
    environment:
      ANONPIP_ENVIRONMENT: ${ANONPIP_ENVIRONMENT:-local}
      ANONPIP_LOG_LEVEL: ${ANONPIP_LOG_LEVEL:-DEBUG}
      ANONPIP_EXTENDED_LOG_CONTEXT: ${ANONPIP_EXTENDED_LOG_CONTEXT:-false}
      ANONPIP_LOG_MASK_PREFIX: ${ANONPIP_LOG_MASK_PREFIX:-1}
      ANONPIP_LOG_MASK_SUFFIX: ${ANONPIP_LOG_MASK_SUFFIX:-1}
      ANONPIP_PIPELINE_CONFIG_FILE: ${ANONPIP_PIPELINE_CONFIG_FILE:-}
      ANONPIP_MAX_UPLOAD_MB: ${ANONPIP_MAX_UPLOAD_MB:-30}
      ANONPIP_MAX_QUEUED_JOBS: ${ANONPIP_MAX_QUEUED_JOBS:-20}
      ANONPIP_MAX_KEPT_JOBS: ${ANONPIP_MAX_KEPT_JOBS:-50}
      ANONPIP_JOB_TTL_S: ${ANONPIP_JOB_TTL_S:-1800}
      # optional credential (only mode=pseudonym): empty means no service key, never a default key
      ANONPIP_VAULT_KEY: ${ANONPIP_VAULT_KEY:-}
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml:ro
    command: uvicorn anonymization_pipeline.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src
