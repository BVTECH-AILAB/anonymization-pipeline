# Local development stack: the anonymization service (no database: jobs live
# in memory and documents in a private folder until they expire).
# Settings have defaults (${VAR:-default}); this service has no credentials.
# Model weights are cached in the "models" volume, so they download once.
name: anonmyzation-pipeline

services:
  app:
    build:
      context: .
      target: dev
    environment:
      ANONPIP_ENVIRONMENT: ${ANONPIP_ENVIRONMENT:-local}
      ANONPIP_LOG_LEVEL: ${ANONPIP_LOG_LEVEL:-DEBUG}
      ANONPIP_EXTENDED_LOG_CONTEXT: ${ANONPIP_EXTENDED_LOG_CONTEXT:-false}
      ANONPIP_LOG_MASK_PREFIX: ${ANONPIP_LOG_MASK_PREFIX:-1}
      ANONPIP_LOG_MASK_SUFFIX: ${ANONPIP_LOG_MASK_SUFFIX:-1}
      ANONPIP_UI_ENABLED: ${ANONPIP_UI_ENABLED:-true}
      ANONPIP_DEVICE: ${ANONPIP_DEVICE:-auto}
      ANONPIP_PRELOAD_MODELS: ${ANONPIP_PRELOAD_MODELS:-true}
      ANONPIP_OCR_SERVER_URL: ${ANONPIP_OCR_SERVER_URL:-http://paddle-ocr:8829}
      ANONPIP_OCR_DPI: ${ANONPIP_OCR_DPI:-300}
      ANONPIP_NER_ENABLED: ${ANONPIP_NER_ENABLED:-true}
      ANONPIP_NER_MODEL: ${ANONPIP_NER_MODEL:-urchade/gliner_multi_pii-v1}
      ANONPIP_NER2_ENABLED: ${ANONPIP_NER2_ENABLED:-true}
      ANONPIP_NER2_MODEL: ${ANONPIP_NER2_MODEL:-fastino/gliner2-privacy-filter-PII-multi}
      ANONPIP_NER_THRESHOLD: ${ANONPIP_NER_THRESHOLD:-0.5}
      ANONPIP_NER_PERSON_THRESHOLD: ${ANONPIP_NER_PERSON_THRESHOLD:-0.4}
      ANONPIP_MAX_UPLOAD_MB: ${ANONPIP_MAX_UPLOAD_MB:-30}
      ANONPIP_MAX_PAGES: ${ANONPIP_MAX_PAGES:-50}
      ANONPIP_JOB_TTL_MINUTES: ${ANONPIP_JOB_TTL_MINUTES:-30}
      ANONPIP_MAX_JOBS: ${ANONPIP_MAX_JOBS:-20}
      ANONPIP_WORK_DIR: ${ANONPIP_WORK_DIR:-}
      ANONPIP_REDACT_CLINICAL_DATES: ${ANONPIP_REDACT_CLINICAL_DATES:-false}
      ANONPIP_REDACT_AGE: ${ANONPIP_REDACT_AGE:-false}
      ANONPIP_REDACT_ORGANIZATIONS: ${ANONPIP_REDACT_ORGANIZATIONS:-false}
      ANONPIP_REDACTION_STYLE: ${ANONPIP_REDACTION_STYLE:-black}
      ANONPIP_VERIFY_PIXEL_TOLERANCE: ${ANONPIP_VERIFY_PIXEL_TOLERANCE:-0.0002}
      # Hugging Face (GLiNER) weight cache, on the "models" volume
      HF_HOME: /models/huggingface
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml:ro
      - models:/models
    # GPU (NVIDIA Container Toolkit): uncomment to run NER on the GPU.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    depends_on:
      - paddle-ocr
    command: >
      uvicorn anonmyzation_pipeline.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src

  # OCR server (PP-OCRv5 on RapidOCR, LiteParse OCR API): the service reads scanned pages through it
  paddle-ocr:
    build:
      context: ./ocr-server
      args:
        # cpu works everywhere; gpu (CUDA 12 wheels) needs the deploy block below
        OCR_EXTRA: ${OCR_EXTRA:-cpu}
    environment:
      OCRSRV_LOG_LEVEL: ${OCRSRV_LOG_LEVEL:-INFO}
      OCRSRV_DEVICE: ${OCRSRV_DEVICE:-auto}
      OCRSRV_DET_MODEL: ${OCRSRV_DET_MODEL:-PP-OCRv5_server_det}
      OCRSRV_MARGIN_PT: ${OCRSRV_MARGIN_PT:-60}
      OCRSRV_MARGIN_MIN_SCORE: ${OCRSRV_MARGIN_MIN_SCORE:-0.5}
      OCRSRV_MAX_UPLOAD_MB: ${OCRSRV_MAX_UPLOAD_MB:-40}
      OCRSRV_GPU_MEM_LIMIT_MB: ${OCRSRV_GPU_MEM_LIMIT_MB:-0}
      # weights download there on the first start (about 90 MB)
      OCRSRV_MODEL_DIR: ${OCRSRV_MODEL_DIR:-/models/rapidocr}
    ports:
      - "127.0.0.1:${OCR_PORT:-8829}:8829"
    volumes:
      - models:/models
    # GPU (NVIDIA Container Toolkit, OCR_EXTRA=gpu): uncomment to run OCR on the GPU.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  models:
