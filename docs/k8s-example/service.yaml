# REFERENCE ONLY - not applied by anything.
# What the platform team adds to oke-staging/<namespace>/ for this service,
# modelled on oke-staging/doctor-authz/doctor-authz.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: anonmyzation-pipeline-config-env
data:
  ANONPIP_ENVIRONMENT: "staging"
  ANONPIP_LOG_LEVEL: "DEBUG"
  ANONPIP_EXTENDED_LOG_CONTEXT: "false"
  ANONPIP_UI_ENABLED: "true"
  ANONPIP_WORK_DIR: "/work"
  ANONPIP_NER_URL: "http://<ner-service>.<ner-namespace>.svc.cluster.local:<port>"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  name: anonmyzation-pipeline
  labels:
    app: anonmyzation-pipeline
spec:
  # Jobs live in memory: one replica, or session affinity on the ingress.
  replicas: 1
  selector:
    matchLabels:
      app: anonmyzation-pipeline
  template:
    metadata:
      labels:
        app: anonmyzation-pipeline
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - anonmyzation-pipeline
            topologyKey: "kubernetes.io/hostname"
      containers:
      - name: anonmyzation-pipeline
        image: harbor.agenas.oci/agenas/anonmyzation-pipeline:2026.10.06-test.1791280000 # {"$imagepolicy": "flux-system:anonmyzation-pipeline-test"}
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: anonmyzation-pipeline-config-env
        volumeMounts:
        - name: models          # PaddleOCR models (ANONPIP_OCR_MODEL_DIR)
          mountPath: /models
        - name: work            # documents, deleted after ANONPIP_JOB_TTL_MINUTES
          mountPath: /work
        ports:
        - containerPort: 8000
          name: web
        readinessProbe:
          httpGet:
            path: /readyz
            port: web
          initialDelaySeconds: 30   # 503 until OCR is loaded and the NER service answers
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: web
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests:
            cpu: "1"
            memory: 4Gi
          limits:
            cpu: "4"
            memory: 8Gi
            nvidia.com/gpu: 1
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: anonmyzation-pipeline-models
      - name: work
        emptyDir:
          sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: anonmyzation-pipeline
  labels:
    app: anonmyzation-pipeline
spec:
  ports:
    - name: web
      port: 8000
      targetPort: web
  selector:
    app: anonmyzation-pipeline
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: anonmyzation-pipeline-ingress
spec:
  ingressClassName: traefik-int
  rules:
  - host: "anonmyzation-pipeline.agenas-stg.oci"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: anonmyzation-pipeline
            port:
              name: web
