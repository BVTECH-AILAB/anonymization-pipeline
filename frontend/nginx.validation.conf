# Validation API (validation/anonval/api.py), local docker compose only: mounted in
# /etc/nginx/extra/ by docker-compose.yml, included by nginx.conf.template. Same origin as the UI.
location /validazione-api/ {
    proxy_pass http://validation:8001/;
    proxy_read_timeout 120s;                # POST /runs checks the service before answering
}
