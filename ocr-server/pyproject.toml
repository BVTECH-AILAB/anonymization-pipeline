# The OCR server (second pod): one project, imported as `src.*` and served as
# `src.main:app` on port 8829, like the backend and ai-platform-v2. Not installed
# as a package: no build backend.
[project]
name = "paddle-ocr-server"
version = "0.1.0"
description = "PP-OCRv5 (RapidOCR) behind the LiteParse OCR API (POST /ocr), one result per word"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.20",
    "pydantic-settings>=2.7",
    "numpy>=2.0",
    "pillow>=11.0",
    # the version of the measured run (OpenCV 5 drops the cv2.rotate constants)
    "opencv-python-headless>=4.10,<4.11",
    "rapidocr>=3.10",
]

[project.optional-dependencies]
# ONNX Runtime: exactly one of the two
cpu = ["onnxruntime>=1.22,<1.24"]
# CUDA 12 and cuDNN 9 come as wheels: the host needs only the NVIDIA driver
gpu = ["onnxruntime-gpu[cuda,cudnn]>=1.22,<1.24"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.15",
    "ty>=0.0.1a0",
]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.ruff]
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "ARG", "UP", "T20", "S", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the root of this service: `src` and `tests` are imported from here
pythonpath = ["."]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
