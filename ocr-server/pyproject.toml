[project]
name = "paddle-ocr-server"
version = "0.1.0"
description = "PaddleOCR behind the LiteParse OCR API (POST /ocr), one result per word"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.20",
    "pydantic-settings>=2.7",
    "numpy>=2.0",
    "pillow>=11.0",
    "paddleocr>=3.7",
]

[project.optional-dependencies]
cpu = ["paddlepaddle>=3.3"]
# CUDA 12.9 wheels, needed for Blackwell GPUs (sm_120)
gpu = ["paddlepaddle-gpu>=3.3"]
# RapidOCR engine (OCRSRV_ENGINE=rapidocr): the same PP-OCRv5 models on ONNX Runtime
rapid = ["rapidocr>=3.10", "onnxruntime-gpu>=1.22,<1.24"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.15",
]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[[tool.uv.index]]
name = "paddle-cu129"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu129/"
explicit = true

[[tool.uv.index]]
name = "paddle-cpu"
url = "https://www.paddlepaddle.org.cn/packages/stable/cpu/"
explicit = true

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle-cu129", extra = "gpu" }
paddlepaddle = { index = "paddle-cpu", extra = "cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paddle_ocr_server"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "ARG", "UP", "T20", "S", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
