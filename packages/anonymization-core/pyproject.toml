[project]
name = "anonymization-core"
version = "0.1.0"
description = "Surgical anonymization of clinical documents (PDF, scans, images): text layers, PII detection, verified redaction"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28",
    "liteparse>=2.16.0",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pillow>=11.0",
    "pypdf>=6.0",
    "pypdfium2>=5.0",
    "python-codicefiscale>=0.12",
    "python-docx>=1.1",
    "pyyaml>=6.0",
    "zxing-cpp>=2.3",
]

[project.optional-dependencies]
# anonymization_core.testing: synthetic PDFs and fake engines for the tests of callers too
testing = [
    "pytest>=8.3",
    "qrcode>=8.0",
    "reportlab>=4.2",
]

[dependency-groups]
dev = [
    "anonymization-core[testing]",
    "pytest-cov>=6.0",
    "ruff>=0.15",
    "ty>=0.0.1a0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anonymization_core"]

# Self-contained on purpose: the package lints the same way once extracted.
[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
#   UP  - modern 3.12 syntax
#   T20 - no print(): everything goes through logging
#   S   - bandit security checks
#   PLC0415 - imports at module level only
select = ["E", "F", "B", "I", "ARG", "UP", "T20", "S", "TID251", "PLC0415"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ARG"]
# the fakes keep the signatures of the methods they override
"src/anonymization_core/testing.py" = ["ARG"]

# The engine is a library: it never imports the service around it, the
# developer tools or a web framework, and never configures logging itself.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"logging.basicConfig".msg = "The engine never configures logging: its caller does."
"os.getenv".msg = "The engine takes a PipelineConfig: it never reads the environment."
"fastapi".msg = "The engine has no web framework: raise an engine error from errors.py."
"starlette".msg = "The engine has no web framework: raise an engine error from errors.py."
"anonymization_pipeline".msg = "The engine never imports the service built on it."
"tools".msg = "The engine never imports the developer tools."

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["anonymization_core"]
# test kit, exercised by the tests themselves
omit = ["*/anonymization_core/testing.py"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
