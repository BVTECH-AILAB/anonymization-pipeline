[project]
name = "anonymization-pipeline"
version = "0.1.0"
description = "AGENAS MIA platform service (generated from agenas-python-template)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "numpy>=2",
    "pillow>=11",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pypdf>=6",
    "pypdfium2>=4.30,<6",
    "python-multipart>=0.0.20",
    "pyyaml>=6",
    "uvicorn[standard]>=0.34",
    "zxing-cpp>=2.3",
]

[project.optional-dependencies]
# NER detector (detection.ner): token classification (transformers) or GLiNER, on CPU.
# torch comes from the CPU index (see [tool.uv.sources]): no proprietary CUDA libraries.
ner = [
    "gliner>=0.2.20",
    "huggingface-hub>=0.30",
    "protobuf>=4",
    "torch>=2.6",
    "transformers>=4.51",
]

# OCR of scanned pages (ocr): docTR on CPU, OpenCV headless for the marks on scans.
ocr = [
    "opencv-python-headless>=4.10",
    "python-doctr>=1.0",
    "torch>=2.6",
    "torchvision>=0.21",
]

[dependency-groups]
dev = [
    "pip-audit>=2.7",
    "pip-licenses>=5",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "reportlab>=4.2",
    "rich>=13",
    "ruff>=0.15",
    "ty>=0.0.1a0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anonymization_pipeline"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests", "validation"]

[tool.ruff.lint]
# Same base as ai-platform / llm-gateway, plus:
#   UP  - modern 3.12 syntax
#   T20 - no print(): everything goes through logging
#   S   - bandit security checks
select = ["E", "F", "B", "I", "ARG", "UP", "T20", "S", "TID251"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ARG"]
"validation/tests/**" = ["S101", "S105", "S106", "ARG"]
# synthetic dataset: seeded, reproducible values, nothing cryptographic
"validation/anonval/**" = ["S311"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"logging.basicConfig".msg = "Use anonymization_pipeline.logging_setup.setup_logging: it installs the PII redaction filter."
"os.getenv".msg = "Read configuration through Settings in config.py, so every variable has a typed default."

[tool.pytest.ini_options]
testpaths = ["tests", "validation/tests"]
# the validation harness (validation/anonval) is a tool outside the package
pythonpath = ["validation"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not models' --strict-markers"
markers = [
    "models: needs the extras and the real models in the cache (`just models`, `just test-models`)",
]

[tool.coverage.run]
source = ["anonymization_pipeline"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.uv]
# python-doctr pulls opencv-python, which needs X11 libraries missing from the slim image: the
# headless build (in the ocr extra) provides the same cv2 module.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
