# uv workspace root (not a package): one lock for every member.
#   packages/anonymization-core  the engine (library)
#   apps/api                     the service (image anonmyzation-pipeline)
# The dev group below is the developer environment: every member plus tools/.
[tool.uv.workspace]
members = ["packages/*", "apps/api"]

[dependency-groups]
dev = [
    "anonmyzation-pipeline",
    "anonymization-core[testing]",
    "pip-audit>=2.7",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.15",
    "ty>=0.0.1a0",
    # tools/: synthetic dataset, evaluation, OCR benchmark
    "faker>=30.0",
    "python-barcode>=0.15",
    "qrcode>=8.0",
    "reportlab>=4.2",
    "typer>=0.27.3",
    "scikit-learn>=1.9.1",
    # mAP of the evaluation (torchmetrics) and its NMS (torchvision)
    "torch>=2.7",
    "torchmetrics>=1.9.0",
    "torchvision>=0.22",
    "pycocotools>=2.0.11",
]

# PyTorch with CUDA 12.8 (Blackwell GPUs included); the same wheels run on CPU.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
anonmyzation-pipeline = { workspace = true }
anonymization-core = { workspace = true }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

# tools/ and its tests (tests/tools); every member has its own config.
[tool.ruff]
target-version = "py312"
src = ["tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "ARG", "UP", "T20", "S", "TID251", "PLC0415"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ARG"]
# Synthetic data generation uses non-cryptographic randomness on purpose.
"tools/**" = ["S311"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"logging.basicConfig".msg = "Use anonmyzation_pipeline.logging_setup.setup_logging: it installs the PII redaction filter."
"os.getenv".msg = "Read configuration through Settings in config.py, so every variable has a typed default."

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
