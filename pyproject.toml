[project]
name = "anonymization-pipeline"
version = "0.1.0"
description = "AGENAS MIA platform service (generated from agenas-python-template)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "numpy>=2",
    "pillow>=11",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pypdf>=6",
    "pypdfium2>=4.30,<6",
    "python-multipart>=0.0.20",
    "pyyaml>=6",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "pip-audit>=2.7",
    "pip-licenses>=5",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "reportlab>=4.2",
    "rich>=13",
    "ruff>=0.15",
    "ty>=0.0.1a0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anonymization_pipeline"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests", "validation"]

[tool.ruff.lint]
# Same base as ai-platform / llm-gateway, plus:
#   UP  - modern 3.12 syntax
#   T20 - no print(): everything goes through logging
#   S   - bandit security checks
select = ["E", "F", "B", "I", "ARG", "UP", "T20", "S", "TID251"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ARG"]
"validation/tests/**" = ["S101", "S105", "S106", "ARG"]
# synthetic dataset: seeded, reproducible values, nothing cryptographic
"validation/anonval/**" = ["S311"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"logging.basicConfig".msg = "Use anonymization_pipeline.logging_setup.setup_logging: it installs the PII redaction filter."
"os.getenv".msg = "Read configuration through Settings in config.py, so every variable has a typed default."

[tool.pytest.ini_options]
testpaths = ["tests", "validation/tests"]
# the validation harness (validation/anonval) is a tool outside the package
pythonpath = ["validation"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not integration' --strict-markers"
markers = [
    "integration: needs the compose Ollama, run with `just test-vlm`",
]

[tool.coverage.run]
source = ["anonymization_pipeline"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
