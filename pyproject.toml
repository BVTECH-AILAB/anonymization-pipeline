# uv workspace root (not a package): one lock for every member.
#   packages/anonymization-core  the engine (library)
#   apps/api                     the service (image anonmyzation-pipeline)
#   apps/eval                    synthetic dataset, evaluation, viewer (dev only)
# The dev group below is the developer environment: every member and the
# repository-wide tools (pre-commit, audit). Each member has its own lint,
# type, test and coverage configuration.
[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[dependency-groups]
dev = [
    "anonmyzation-pipeline",
    "anonymization-eval",
    "anonymization-core[testing]",
    "httpx>=0.28",
    "pip-audit>=2.7",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.15",
    "ty>=0.0.1a0",
]

# PyTorch with CUDA 12.8 (Blackwell GPUs included); the same wheels run on CPU.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
anonmyzation-pipeline = { workspace = true }
anonymization-core = { workspace = true }
anonymization-eval = { workspace = true }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
