[project]
name = "anonmyzation-pipeline"
version = "0.1.0"
description = "AGENAS MIA service: surgical anonymization of clinical documents (C1), generated from agenas-python-template"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.20",
    # Anonymization engine
    "numpy>=2.0",
    "pillow>=11.0",
    "opencv-python-headless>=4.10",
    "zxing-cpp>=2.3",
    "python-codicefiscale>=0.12",
    "python-docx>=1.1",
    "pyyaml>=6.0",
    "liteparse>=2.16.0",
    "pypdfium2>=5.0",
    "pypdf>=6.0",
]

[dependency-groups]
dev = [
    "pip-audit>=2.7",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.15",
    "ty>=0.0.1a0",
    # tools/: synthetic dataset, evaluation, OCR benchmark
    "faker>=30.0",
    "python-barcode>=0.15",
    "qrcode>=8.0",
    "reportlab>=4.2",
    "typer>=0.27.3",
    "scikit-learn>=1.9.1",
    # mAP of the evaluation (torchmetrics) and its NMS (torchvision)
    "torch>=2.7",
    "torchmetrics>=1.9.0",
    "torchvision>=0.22",
    "pycocotools>=2.0.11",
]

# PyTorch with CUDA 12.8 (Blackwell GPUs included); the same wheels run on CPU.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anonmyzation_pipeline"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
# Same base as ai-platform / llm-gateway, plus:
#   UP  - modern 3.12 syntax
#   T20 - no print(): everything goes through logging
#   S   - bandit security checks
#   PLC0415 - imports at module level only (CLAUDE.md)
select = ["E", "F", "B", "I", "ARG", "UP", "T20", "S", "TID251", "PLC0415"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ARG"]
# Synthetic data generation uses non-cryptographic randomness on purpose.
"tools/**" = ["S311"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"logging.basicConfig".msg = "Use anonmyzation_pipeline.logging_setup.setup_logging: it installs the PII redaction filter."
"os.getenv".msg = "Read configuration through Settings in config.py, so every variable has a typed default."

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"

[tool.coverage.run]
source = ["anonmyzation_pipeline"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
