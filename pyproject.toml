# uv workspace root (not a package): one lock for every member.
#   backend/core  the engine (library)
#   backend/api   the service; with the engine, the image anonymization-pipeline
# The OCR server (ocr-server/, the second pod) has its own lock. The dev group below is
# the developer environment: every member and the repository-wide tools
# (pre-commit, audit). Each member has its own lint, type, test and coverage
# configuration.
[tool.uv.workspace]
members = ["backend/core", "backend/api"]
# own lock and ONNX Runtime extras (cpu | gpu): kept out of the workspace
exclude = ["ocr-server"]

[dependency-groups]
dev = [
    "anonymization-pipeline",
    "anonymization-core[testing]",
    "httpx>=0.28",
    "pip-audit>=2.7",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.15",
    "ty>=0.0.1a0",
]

[tool.uv.sources]
anonymization-pipeline = { workspace = true }
anonymization-core = { workspace = true }
