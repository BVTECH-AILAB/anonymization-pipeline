[project]
name = "anonymization-pipeline"
version = "0.1.0"
description = "Anonymization of Italian documents (PDF, images, text) with a local VLM, docling and rule/label/NER detectors"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=42",
    "docling-core>=2.101,<3",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pillow>=10.3",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pypdfium2>=4.30,<6",
    "python-multipart>=0.0.18",
    "pyyaml>=6",
    "reportlab>=4.2",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
# NER detector (phases.detection.detectors.ner). torch comes from the CPU index (see [tool.uv.sources]).
ner = [
    "huggingface-hub>=0.30",
    "torch>=2.6",
    "transformers>=4.51.3,<5.17",
]
# Extraction of native PDF pages (phases.extraction.native_pdf).
docling = [
    "docling>=2.130,<3",
    "opencv-python-headless>=4.10",
    "torch>=2.6",
    "torchvision>=0.21",
]

[dependency-groups]
dev = [
    "pip-audit>=2.7",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "rich>=13",
    "ruff>=0.15",
    "ty>=0.0.1a0",
]

[tool.uv]
# docling pulls opencv-python, which needs X11 libraries missing from the slim image: the headless
# build (in the docling extra) provides the same cv2 module.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# PyPI wheels of torch are built for CUDA: the GPU is used only by the VLM backend.
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anonymization_pipeline"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests", "validation"]

[tool.ruff.lint]
# Same base as ai-platform / llm-gateway, plus:
#   UP  - modern 3.12 syntax
#   T20 - no print(): everything goes through logging
#   S   - bandit security checks
select = ["E", "F", "B", "I", "ARG", "UP", "T20", "S", "TID251"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ARG"]
"validation/tests/**" = ["S101", "S105", "S106", "ARG"]
# synthetic dataset: seeded, reproducible values, nothing cryptographic
"validation/anonval/**" = ["S311"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"logging.basicConfig".msg = "Use anonymization_pipeline.logging_setup.setup_logging: it installs the PII redaction filter."
"os.getenv".msg = "Read configuration through Settings in config.py, so every variable has a typed default."

[tool.pytest.ini_options]
testpaths = ["tests", "validation/tests"]
# the validation harness (validation/anonval) is a tool outside the package
pythonpath = ["validation"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not integration and not ner and not docling' --strict-markers"
markers = [
    "integration: needs the compose Ollama, run with `just test-vlm`",
    "ner: needs the 'ner' extra and the NER model in HF_HOME",
    "docling: needs the 'docling' extra and its models",
]

[tool.coverage.run]
source = ["anonymization_pipeline"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ty.environment]
extra-paths = ["validation"]

[tool.ty.analysis]
# Optional extras (ner, docling): not installed by `uv sync`, so lint and CI do not need them.
allowed-unresolved-imports = [
    "docling.**",
    "docling_core.**",
    "huggingface_hub",
    "huggingface_hub.**",
    "torch",
    "torch.**",
    "transformers",
    "transformers.**",
]
