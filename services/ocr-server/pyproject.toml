[project]
name = "paddle-ocr-server"
version = "0.1.0"
description = "PP-OCRv5 (RapidOCR) behind the LiteParse OCR API (POST /ocr), one result per word"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.20",
    "pydantic-settings>=2.7",
    "numpy>=2.0",
    "pillow>=11.0",
    # the version of the measured run (OpenCV 5 drops the cv2.rotate constants)
    "opencv-python-headless>=4.10,<4.11",
    "rapidocr>=3.10",
]

[project.optional-dependencies]
# ONNX Runtime: exactly one of the two
cpu = ["onnxruntime>=1.22,<1.24"]
# CUDA 12 and cuDNN 9 come as wheels: the host needs only the NVIDIA driver
gpu = ["onnxruntime-gpu[cuda,cudnn]>=1.22,<1.24"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.15",
]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paddle_ocr_server"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "ARG", "UP", "T20", "S", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
