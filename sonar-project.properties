# Replace CHANGEME with the key SonarQube assigns when the project is created.
sonar.projectKey=application_backend_anonymization-pipeline_CHANGEME
sonar.qualitygate.wait=true

sonar.sources=backend/src/,ocr-server/src/
sonar.tests=backend/tests/,ocr-server/tests/
sonar.exclusions=**/docs/**,**/static/**
sonar.python.coverage.reportPaths=backend/coverage.xml,ocr-server/coverage.xml
sonar.python.version=3.12
