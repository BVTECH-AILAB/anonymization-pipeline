# Replace CHANGEME with the key SonarQube assigns when the project is created.
sonar.projectKey=application_backend_anonymization-pipeline_CHANGEME
sonar.qualitygate.wait=true

sonar.sources=backend/api/src/,backend/core/src/
sonar.tests=backend/api/tests/,backend/core/tests/
sonar.exclusions=**/docs/**,**/static/**
sonar.python.coverage.reportPaths=backend/api/coverage.xml,backend/core/coverage.xml
sonar.python.version=3.12
