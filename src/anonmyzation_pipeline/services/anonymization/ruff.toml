# The engine is a library: it never imports the service around it or a web
# framework, so it can be extracted on its own.
extend = "../../../../pyproject.toml"

[lint.flake8-tidy-imports.banned-api]
"logging.basicConfig".msg = "Use anonmyzation_pipeline.logging_setup.setup_logging: it installs the PII redaction filter."
"os.getenv".msg = "Read configuration through Settings in config.py, so every variable has a typed default."
"fastapi".msg = "The engine has no web framework: raise an engine error from errors.py."
"starlette".msg = "The engine has no web framework: raise an engine error from errors.py."
"anonmyzation_pipeline.api".msg = "The engine never imports the service."
"anonmyzation_pipeline.config".msg = "The engine takes a PipelineConfig, never the service Settings."
"anonmyzation_pipeline.errors".msg = "Raise an engine error from services/anonymization/errors.py."
"anonmyzation_pipeline.logging_setup".msg = "The engine only logs through logging.getLogger(__name__)."
"anonmyzation_pipeline.main".msg = "The engine never imports the service."
"anonmyzation_pipeline.middleware".msg = "The engine never imports the service."
"anonmyzation_pipeline.privacy".msg = "The engine never imports the service."
"anonmyzation_pipeline.services.jobs".msg = "The engine never imports the service."
"tools".msg = "The engine never imports the developer tools."
