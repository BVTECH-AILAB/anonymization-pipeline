# =============================================================================
#  Pipeline configuration (defaults): only the tunable parameters.
#
#  Layers, from weakest to strongest:
#    1. this file, over every category of the registry (categories.yaml) switched on
#    2. the user file in ANONPIP_PIPELINE_CONFIG_FILE (only the keys to change)
#    3. per-request choices (categories switched on or off), within the protection floor
#  Unknown keys are an error: a typo is never silently ignored.
#  Elsewhere: the vocabulary of the text detectors in detectors/*.yaml (not overridable).
# =============================================================================

# -----------------------------------------------------------------------------
#  Ingest: PDF and images (an image becomes a PDF with one page per frame, without recompression)
# -----------------------------------------------------------------------------
ingest:
  max_pages: 50
  max_pixels: 120000000     # per page at render_dpi, per image frame: larger ones are rejected
                            # before decoding (decompression bomb)
  render_dpi: 200           # resolution of page renderings (previews, visual checks)
  image_dpi: 200            # images without a resolution in their metadata

# -----------------------------------------------------------------------------
#  OCR of scanned pages (raster images over half of the page): docTR on CPU (image with the 'ocr'
#  extra, weights downloaded by `just models`). When off, or enabled and not loadable, a document
#  with scanned pages is never released: off -> blocked; not loadable -> service not ready.
# -----------------------------------------------------------------------------
ocr:
  enabled: false
  det_arch: db_resnet50
  reco_arch: parseq
  dpi: 300
  margin_pt: 60             # side strips read again rotated by 90 degrees (vertical text)
  margin_min_conf: 0.5
  threads: 4

# -----------------------------------------------------------------------------
#  Detection, on every text layer of every page
# -----------------------------------------------------------------------------
detection:
  # Detectors in union: one is enough to flag a value. For the same text, between categories of
  # different families the first wins: rules, then labels. The eponym filter applies to all.
  detectors:
    rules: true               # regex + checksum (CF, IBAN, VAT, cards, phones...): detectors/rules.yaml
    labels: true              # value after a label ("Codice paziente: ..."): detectors/labels.yaml
    eponyms: true             # "morbo di Parkinson", "Glasgow 15", Coumadin are not people (decided
                              # on the context of each occurrence): detectors/eponyms.yaml
    visual: true              # signatures, stamps, barcodes and QR codes (group visivi): embedded images
                              # are redacted whole except header logos; on scans, marks OCR does not read
  anchoring:
    min_length: 2             # shorter values are ignored
    case_insensitive_over: 3  # over this length the search ignores case
    fuzzy: 0.9                # minimum similarity when the value is not there verbatim (0 = off)
  # Every value found is searched in every layer of the document (the redaction of a value applies
  # to the whole document). For persons also their other forms: a surname alone ("Sig. Rossi"),
  # with an initial ("ROSSI M."), inverted or glued ("Rossi Mario", "ROSSIMARIO").
  propagation:
    names: true
    min_token: 3              # shorter name tokens are not searched alone
  # NER: a local model on CPU, in union with the rules (image with the 'ner' extra, model downloaded
  # by `just models`). Label map and filters: detectors/ner.yaml. When enabled and not loadable, the
  # service is not ready (/readyz 503) and refuses documents: never a silent drop in protection.
  # Chosen with the validation (96 documents, 15/10/2026): urchade/gliner_multi_pii-v1 (Apache-2.0)
  # took recall from 74.5% to 87.1% and the leak rate from 30.7% to 16.1% without new violated
  # negatives; DeepMount00/Italian_NER_XXL_v2 reached 86.9% / 17.4% with 61 more violated negatives
  # (eponyms taken for persons), knowledgator/gliner-pii-base-v1.0 82.3% / 22.1%.
  ner:
    enabled: true
    engine: gliner            # gliner (zero-shot labels) | token_classification (fixed labels)
    model: urchade/gliner_multi_pii-v1
    revision: null            # model commit (null = the last one downloaded)
    threshold: 0.5
    window_words: 200         # GLiNER reads at most 384 tokens
    overlap_words: 30
    threads: 4                # torch threads: with every core inference is much slower

# -----------------------------------------------------------------------------
#  Redaction of the PDF
#  A page with boxes is rasterised with the boxes painted in (nothing of the original page
#  content survives on it); pages without boxes are kept as they are. Then the whole file is
#  rewritten without metadata, annotations, attachments, scripts, bookmarks and history.
# -----------------------------------------------------------------------------
redaction:
  style: black              # black | label (light box with the category)
  flatten_dpi: 200
  jpeg_quality: 90          # scanned pages; native pages are stored losslessly
  # Markdown: tag ([PERSONA_1], no map) | pseudonym (tags + map encrypted with a key, restorable)
  # | redaction (a fixed symbol). A pseudonymized document is still personal data (PA-13): tag until
  # the DPO decides. Requests may choose the mode; pseudonym needs a key (request or ANONPIP_VAULT_KEY).
  mode: tag
  tag_format: "[{category}_{n}]"
  redaction_symbol: "█████"

# -----------------------------------------------------------------------------
#  Markdown of the document, anonymized with the same values as the PDF (for indexing, RAG)
# -----------------------------------------------------------------------------
markdown:
  enabled: true
  engine: layers            # the text layers of the pages: native text, OCR on scans
  page_separator: "\n\n<!-- pagina {n} -->\n\n"

# -----------------------------------------------------------------------------
#  Verification (fail-closed): a failed check blocks the download
# -----------------------------------------------------------------------------
verification:
  pixel_dpi: 72             # resolution of the comparison outside the boxes (rasterised pages:
                            # flatten_dpi, where they match the original pixel for pixel)
  pixel_threshold: 40       # channel difference that counts as a changed pixel
  pixel_tolerance: 0.0002   # max fraction of changed pixels outside the boxes

# -----------------------------------------------------------------------------
#  Categories to anonymize (registry, groups and descriptions in categories.yaml).
#  Every category of the registry is on: list here only the ones off by default.
#  Here and in the user file also by group:
#  categories: {groups: {organizzazioni: false}, DATORE_LAVORO: true};
#  a category given in the same file wins over its group.
#  Quasi-identifiers (dates, age, profession...) are off: PA-14 is still open.
#  Off does not mean in clear text when the generic category is on: MEDICO is off, PERSONA is on,
#  so a physician's name is redacted as PERSONA (categories.yaml, generic).
# -----------------------------------------------------------------------------
categories: {groups: {date: false, persone_correlate: false, sanitari: false}, ETA: false, STATO_CIVILE: false, PROFESSIONE: false, SESSO: false, STATO: false}

# -----------------------------------------------------------------------------
#  Protection floor: groups and categories a request can never switch off (direct identifiers).
#  Each of them must be on in the effective configuration: switching one off in the user file is
#  a startup error, so the floor is changed only by removing it from this list.
# -----------------------------------------------------------------------------
protection:
  protected: [NOME, COGNOME, PERSONA, DATA_NASCITA, INDIRIZZO, identificativi, documenti, contatti, finanziari,
              identificativi_sanitari]
