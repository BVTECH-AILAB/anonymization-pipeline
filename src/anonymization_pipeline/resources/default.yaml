# =============================================================================
#  Pipeline configuration (defaults): only the tunable parameters.
#
#  Layers, from weakest to strongest:
#    1. this file, with the prompts (prompts/<phase>.yaml, key 'prompts') and every category
#       of the registry (categories.yaml) switched on
#    2. the user file in ANONPIP_PIPELINE_CONFIG_FILE (only the keys to change)
#    3. the models file (ANONPIP_MODELS_FILE, default models.yaml)
#    4. the docling options: docling.yaml, then the keys of ANONPIP_DOCLING_FILE
#    5. the ANONPIP_* settings (config.py)
#    6. per-request overrides (API and web UI: model of each phase, mode, verification,
#       extraction, detectors, categories)
#  Unknown keys are an error: a typo is never silently ignored.
#
#  Keys set only by layers 3, 4 and 5 (never written here, rejected in the user file):
#    models file      models, phases.<phase>.model
#    docling file     phases.extraction.native_pdf.docling
#    ANONPIP_*        backend.kind, url, api_key, concurrency, pull_missing;
#                     phases.redaction.mode, phases.verification.mode,
#                     phases.extraction.native_pdf.engine, native_pdf.models_dir
#
#  Elsewhere: the vocabulary of the text detectors in detectors/*.yaml (not overridable).
# =============================================================================

# -----------------------------------------------------------------------------
#  Local inference backend (kind, url, api_key, concurrency, pull_missing: from the settings)
# -----------------------------------------------------------------------------
backend:
  retries: 2                # new attempts on network errors, 5xx and invalid JSON
  retry_wait_s: 2           # wait before the first new attempt (then it doubles)
  pull_timeout_s: 7200
  health_timeout_s: 5

# -----------------------------------------------------------------------------
#  Generation parameters, the same for every model (models: from the models file)
# -----------------------------------------------------------------------------
generation:
  temperature: 0
  seed: 42                  # reduces (does not remove) differences between runs
  think: false              # models that reason by default spend the answer tokens on reasoning and the
                            # answer comes back empty. null = field not sent
  keep_alive: 30m           # the model stays in VRAM between documents (and phases, if it fits)
  options: {}               # extra backend options passed as they are (e.g. top_k)

# -----------------------------------------------------------------------------
#  Ingest
# -----------------------------------------------------------------------------
images:
  pdf_dpi: 200              # rendering resolution of PDF pages (native ones too: the VLM uses the image
                            # in detection and verification)
  max_side_px: 1600         # longest side of the page image sent to the model
  format: png               # png | jpeg
  jpeg_quality: 90
  max_pixels: 120000000     # larger images are rejected before decoding (decompression bomb)
  max_pages: 200

text:
  encodings: [utf-8-sig, cp1252, latin-1]   # tried in order (UTF-16 only with a BOM)
  max_block_chars: 6000                     # text files are split into blocks (at line ends)

# -----------------------------------------------------------------------------
#  Phases
# -----------------------------------------------------------------------------
phases:
  extraction:
    timeout_s: 600
    max_tokens: 8192
    # Native PDF pages (readable and visible text layer) are extracted with docling (a few seconds on
    # CPU, exact text, structured tables); the others (scans, pages with many images or hidden text)
    # with the VLM. Without docling or its models every page goes to the VLM, with a warning.
    native_pdf:                 # engine, models_dir: from the settings; docling: docling.yaml
      min_chars: 50             # characters of the text layer (spaces excluded) for a native page
      max_unreadable: 0.02      # max fraction of undecodable characters (fonts without a Unicode map)
      max_image_fraction: 0.5   # images over this fraction of the page: scan or content to read
      min_contrast: 12          # text whose box has no contrast in the rendered page is hidden
    # Non-text elements: how they are reported in the Markdown (they end up in the extraction prompt).
    # The text inside stamps and labels must be transcribed: it often holds names and register numbers.
    # The placeholders between [] are the ones that appear in the Markdown.
    visual_elements:
      FIRMA: "[FIRMA] (if the signer's name is legible, transcribe it after the placeholder)"
      TIMBRO: "[TIMBRO: full transcription of the stamp text]"
      FOTO: "[FOTO] (photographs, faces, ID photos)"
      LOGO: "[LOGO: text of the logo, if any]"
      CODICE_A_BARRE: "[CODICE_A_BARRE] (plus the text printed under the code, if any)"
      QR_CODE: "[QR_CODE]"
      IMMAGINE: "[IMMAGINE: short description] (clinical images, charts, traces)"
      MANOSCRITTO: "handwritten text: transcribe it as normal text"

  detection:
    timeout_s: 300
    max_tokens: 4096
    use_image: true             # besides the Markdown, the model sees the page (context: label or value)
    # One call per pass and per page. Short passes: with many categories together the models
    # confuse similar ones and skip some. Each entry is a group or a category.
    passes:
      - [anagrafica, residenza, persone_correlate, documenti]
      - [identificativi, contatti, finanziari, veicoli, identificativi_sanitari, date, organizzazioni]
      - [sanitari, particolari]
    # Detectors in union, run in parallel on every page: one is enough to flag a value.
    # For the same text, between categories of different families the most reliable wins: rules,
    # labels, ner, vlm. The eponym filter applies to all of them (VLM and verification included).
    detectors:
      vlm: true                 # the passes above, with the VLM
      rules: true               # regex + checksum (CF, IBAN, VAT, cards, phones, ICD-10...): detectors/rules.yaml
      labels: true              # value after a label ("Codice paziente: ..."): detectors/labels.yaml
      eponyms: true             # "morbo di Parkinson", "Glasgow 15", Coumadin are not people (decided
                                # on the context of each occurrence): detectors/eponyms.yaml
      ner:                      # token classification on CPU (image with the 'ner' extra, model in HF_HOME);
                                # label map and filters: detectors/ner.yaml
        enabled: true
        model: DeepMount00/Italian_NER_XXL_v2
        revision: null          # model commit (null = the last one downloaded)
        threshold: 0.6
        window_words: 300       # the model reads at most 512 tokens: text split into windows
        overlap_words: 50
        threads: 4              # torch threads: with every core inference is much slower
    anchoring:
      min_length: 2             # shorter values are ignored
      case_insensitive_over: 3  # over this length the search ignores case
      fuzzy: 0.9                # minimum similarity when the value is not there verbatim (0 = off)

  redaction:                    # mode: from the settings
    tag_format: "[{category}_{n}]"
    redaction_symbol: "█████"

  # The model compares the redacted Markdown with the clear original of the page.
  # mode (from the settings): off: no check | report: residuals in the report, document returned |
  # block: residuals -> document rejected
  verification:
    timeout_s: 300
    max_tokens: 4096
    required: true              # if the model does not answer the document is rejected (fail-closed)
    passes: null                # null = the detection passes

# -----------------------------------------------------------------------------
#  Categories to anonymize (registry, groups and descriptions in categories.yaml).
#  Every category of the registry is on: list here only the ones off by default.
#  Here, in the user file and per request also by group:
#  categories: {groups: {organizzazioni: false}, DATORE_LAVORO: true};
#  a category given in the same file wins over its group.
# -----------------------------------------------------------------------------
categories: {}

# -----------------------------------------------------------------------------
#  Output
# -----------------------------------------------------------------------------
output:
  # separator between pages in the Markdown (PDF and multi-page images); {n} = page number
  page_separator: "\n\n<!-- pagina {n} -->\n\n"
  # DEBUG: also produce the transcript IN CLEAR TEXT (<stem>.trascrizione.md). Never in production:
  # a request can ask for it only when ANONPIP_ALLOW_TRANSCRIPT=true.
  save_transcript: false
  # <stem>.metriche.json: times per phase, sub-phase and page, VLM latencies and tokens, CPU and memory
  # (no value of the document)
  save_metrics: true
  # <stem>.anon.pdf: the censored document with the layout of the original (positions, text and
  # tables of docling; pages without docling as flowing text), with the censored structure
  # attached (<stem>.anon.docling.json). In pseudonym mode the map can rebuild the original PDF.
  # Default from ANONPIP_DEFAULT_LAYOUT_OUTPUT; a request can choose (field layout).
  layout_pdf: false
