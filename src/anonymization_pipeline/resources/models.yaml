# =============================================================================
#  VLM models (anonymization_pipeline/pipeline_config/models.py)
#
#  Replace this file with your own through ANONPIP_MODELS_FILE.
#    models: the catalog. `just models` downloads every entry before the service starts, and a
#            request may choose for each phase only a model listed here (and present in the
#            backend, see GET /models). context = num_ctx of the model (Ollama), >= 1024.
#            vision = the model accepts images (`ollama show <model>`: "vision" among the
#            capabilities). Required for extraction (it reads scanned pages); detection sends
#            the page image only to models with vision, text-only models get the Markdown alone.
#    phases: the default model of each phase; every phase must be listed and its model must be
#            in the catalog.
#
#  Different models in different phases are swapped in VRAM at every change of phase when the
#  backend keeps one model loaded (OLLAMA_MAX_LOADED_MODELS=1).
#  Size the GPU on the largest model of the catalog; on a small GPU use smaller models.
# =============================================================================

models:
  - name: granite4.2:8b
    context: 8192                 # with the q4_0 KV cache it fits the 8 GB GPU entirely
    vision: false                 # text only (ollama show: no vision)
  - name: glm-ocr
    context: 8192                 # image + page transcription; ~3 GB, entirely on the GPU
    vision: true
  - name: gemma4:26b-a4b-it-qat
    context: 8192                 # image + page transcription
    vision: true

phases:
  extraction: glm-ocr
  detection: granite4.2:8b
  redaction: granite4.2:8b
  verification: gemma4:26b-a4b-it-qat
