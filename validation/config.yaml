# =============================================================================
#  Configurazione della validazione (validation/README.md)
#
#  Ogni profilo e' un insieme di parametri di POST /jobs: tutto quello che si puo' scegliere
#  prima di avviare un'anonimizzazione. Ogni profilo viene eseguito su tutto il dataset filtrato
#  e il report li confronta. `comune` vale per tutti i profili; un profilo lo sovrascrive campo
#  per campo. Un campo assente (o null) lascia il default del server (variabili ANONPIP_*).
#
#  I parametri di un profilo e i valori ammessi sono elencati in fondo al file.
#
#  `transcript=true` viene sempre inviato dallo script: serve per le metriche. Il server deve
#  avere ANONPIP_ALLOW_TRANSCRIPT=true (mai in prod).
# =============================================================================

server:
  base_url: http://localhost:8000
  poll_interval_s: 2
  timeout_documento_s: 1800     # oltre: il job viene cancellato e il documento conta come errore
  concorrenza: 1                # job inviati insieme; il server ne elabora ANONPIP_MAX_CONCURRENT_JOBS
  chiave_env: ANONVAL_KEY       # variabile d'ambiente con la chiave per mode=pseudonym (mai qui)

dataset:
  percorso: dataset             # relativo a questo file
  tipi: []                      # vuoto = tutti; es. [referto_laboratorio, test_genetico]
  difficolta: []                # vuoto = tutte; facile | media | complessa
  documenti: []                 # id specifici; es. [referto_radiologico_complessa_02]

# Esito PASS/FAIL di ogni profilo nel report. Valori provvisori: le soglie di accettazione
# sono ancora un punto aperto (docs/PUNTI_APERTI.md, PA-15).
soglie:
  recall_min: 0.95              # valori rilevati / valori attesi
  tasso_fuga_max: 0.0           # valori rimasti in chiaro / valori attesi
  precision_min: 0.80           # occorrenze censurate corrette / occorrenze censurate
  f1_min: 0.85

comune:
  mode: tag
  verification: report
  extraction: docling
  layout: false
  # Stesse categorie disattivate di default nel servizio (resources/default.yaml, `categories`):
  # inviate esplicitamente, cosi' la run non dipende dalla configurazione del server.
  disable: [date, persone_correlate, sanitari, ETA, STATO_CIVILE, PROFESSIONE, SESSO, STATO]

profili:
  # Configurazione di default del servizio: modelli, rilevatori ed estrazione del server,
  # categorie disattivate come in default.yaml (da `comune`). Differisce dal default solo dove
  # serve a misurare: mode tag invece di pseudonym (nessuna chiave) e verification report invece
  # di block (un documento con residui viene misurato invece che respinto).
  - nome: default
    descrizione: Configurazione di default del servizio

  - nome: default-noner
    descrizione: Configurazione di default senza il rilevatore NER
    detectors: [vlm, rules, labels, eponyms]

# =============================================================================
#  Parametri di un profilo (tutti opzionali; anche in `comune`)
#
#  Un campo assente o null lascia il default del server. Un campo del profilo sostituisce quello
#  di `comune` (non si somma): un profilo che imposta `disable` deve ripetere le categorie di
#  default se vuole tenerle spente.
#
#  nome          obbligatorio: minuscole, cifre, - e _ (max 41 caratteri), unico
#  descrizione   testo libero, riportato nel report
#
#  mode          pseudonym   valori sostituiti da pseudonimi reversibili (serve la chiave in
#                            ANONVAL_KEY, vedi server.chiave_env)
#                tag         valori sostituiti da [CATEGORIA_n]
#                redaction   valori sostituiti dal simbolo di redazione
#                default del server: pseudonym (ANONPIP_DEFAULT_MODE)
#
#  verification off         nessuna verifica
#                report      i residui trovati dal verificatore finiscono nel report
#                block       un documento con residui viene respinto (niente metriche)
#                default del server: block (ANONPIP_DEFAULT_VERIFICATION)
#
#  extraction    docling     le pagine native del PDF lette da docling
#                vlm         anche le pagine native lette dal VLM
#                default del server: docling (ANONPIP_DEFAULT_EXTRACTION)
#
#  model_extraction, model_detection, model_verification
#                un nome del catalogo dei modelli (GET /models; ANONPIP_MODELS_FILE). Catalogo
#                del pacchetto (resources/models.yaml):
#                  glm-ocr                default di extraction
#                  gemma4:26b-a4b-it-qat  default di detection e verification
#                Il modello deve essere presente nel backend: lo script lo controlla all'avvio.
#
#  detectors     insieme COMPLETO dei rilevatori attivi: quelli non elencati vengono spenti.
#                Almeno uno tra vlm, rules, labels, ner.
#                  vlm      rilevazione con il VLM
#                  rules    regex e checksum (CF, IBAN, P.IVA, carte, telefoni...)
#                  labels   valore dopo un'etichetta ("Codice paziente: ...")
#                  ner      modello NER su CPU (richiede l'extra ner sul server)
#                  eponyms  filtro degli eponimi ("morbo di Parkinson" non e' una persona)
#                default del server: tutti e cinque
#
#  enable        gruppi o categorie da attivare
#  disable       gruppi o categorie da disattivare (disable vince su enable)
#                Si possono mescolare gruppi (minuscolo) e categorie (MAIUSCOLO). Default del
#                server: tutte attive tranne date, persone_correlate, sanitari, ETA,
#                STATO_CIVILE, PROFESSIONE, SESSO, STATO (resources/default.yaml).
#                Gruppi e categorie (resources/categories.yaml, GET /categories):
#                  anagrafica         NOME, COGNOME, PERSONA, PATERNITA_MATERNITA, SESSO,
#                                     DATA_NASCITA, DATA_DECESSO, LUOGO_NASCITA, CITTADINANZA,
#                                     STATO_CIVILE, PROFESSIONE, TITOLO_STUDIO, ETA
#                  residenza          INDIRIZZO, CAP, LUOGO, STATO
#                  identificativi     CODICE_FISCALE, PARTITA_IVA, TESSERA_SANITARIA,
#                                     CODICE_STP_ENI, CODICE_ESENZIONE, NUMERO_POLIZZA,
#                                     NUMERO_PROTOCOLLO
#                  documenti          NUMERO_CARTA_IDENTITA, NUMERO_PASSAPORTO, NUMERO_PATENTE,
#                                     NUMERO_PERMESSO_SOGGIORNO, ENTE_RILASCIO, DATA_RILASCIO,
#                                     DATA_SCADENZA, MRZ
#                  contatti           EMAIL, PEC, TELEFONO, FAX, USERNAME_SOCIAL, INDIRIZZO_IP,
#                                     ID_DISPOSITIVO, URL_PERSONALE
#                  finanziari         IBAN, CARTA_CREDITO, NUMERO_CONTO
#                  veicoli            TARGA, TELAIO
#                  identificativi_sanitari
#                                     ID_PAZIENTE, NUMERO_CARTELLA, NUMERO_ACCETTAZIONE,
#                                     NUMERO_REFERTO, NUMERO_RICETTA, NUMERO_PRENOTAZIONE,
#                                     ACCESSION_NUMBER, CODICE_CAMPIONE
#                  persone_correlate  MEDICO, OPERATORE_SANITARIO, NUMERO_ALBO, FAMILIARE,
#                                     CONTATTO_EMERGENZA, TUTORE_DELEGATO
#                  date               DATA, DATA_VISITA, DATA_REFERTO, DATA_RICOVERO,
#                                     DATA_PRESCRIZIONE
#                  organizzazioni     ORGANIZZAZIONE, STRUTTURA_SANITARIA, REPARTO,
#                                     DATORE_LAVORO, SCUOLA
#                  sanitari           DIAGNOSI, PATOLOGIA, TERAPIA, FARMACO, ESAME_VALORE,
#                                     INTERVENTO, ALLERGIA, GRUPPO_SANGUIGNO, INVALIDITA,
#                                     GRAVIDANZA, SALUTE_MENTALE, DIPENDENZE, MALATTIE_INFETTIVE,
#                                     DATO_GENETICO, MISURE_ANTROPOMETRICHE, DECESSO_CAUSA
#                  particolari        RELIGIONE, ORIENTAMENTO_SESSUALE, OPINIONE_POLITICA,
#                                     SINDACATO, ETNIA, DATI_GIUDIZIARI, DATO_BIOMETRICO
#                Una categoria specifica spenta ricade sulla sua generica se attiva (es. MEDICO
#                spento, PERSONA attiva -> censurato come PERSONA).
#
#  layout        true | false  anche il PDF con il layout dell'originale (non usato dalle
#                metriche, rallenta). Default del server: false (ANONPIP_DEFAULT_LAYOUT_OUTPUT)
# =============================================================================
